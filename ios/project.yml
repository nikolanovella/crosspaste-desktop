name: CrossPasteIOS
options:
  bundleIdPrefix: com.nikolanovella.crosspaste
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: NO
targets:
  CrossPasteIOS:
    type: application
    platform: iOS
    sources:
      - CrossPasteIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikolanovella.crosspaste.ios
        PRODUCT_NAME: CrossPaste
        INFOPLIST_FILE: CrossPasteIOS/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
schemes:
  CrossPasteIOS:
    build:
      targets:
        CrossPasteIOS: all
